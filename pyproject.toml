[project]
name = "tallyline"
version = "0.1.0"
description = "Evidence-first grant closeout agent for small community organizations"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "strands-agents>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "playwright>=1.50,<2",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
